<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Edit Enquiry</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Same CSS file you shared -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-wrapper d-flex">

  <!-- Sidebar -->
  <aside class="admin-sidebar d-none d-lg-flex">
    <h4 class="logo">Admin Panel</h4>
    <ul class="nav flex-column mt-4">
      <li class="nav-item active"><a href="index.html">Enquiries</a></li>
      <li class="nav-item"><a href="#">Clients</a></li>
      <li class="nav-item"><a href="#">Projects</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="admin-content flex-grow-1">

    <!-- Mobile Menu -->
    <button class="btn btn-primary d-lg-none mb-3"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobileSidebar">
      Menu
    </button>

    <!-- Header -->
    <div class="admin-header mb-4">
      <h2>Edit Enquiry</h2>
    </div>

    <!-- Edit Form Card -->
    <div class="details-card">

      <a href="./adminenquire.html" class="back-link">&larr; Back to Enquiries</a>

      <form>

        <div class="detail-grid">

          <div>
            <label>Client Name</label>
            <input type="text" class="form-control" value="Amit Sharma">
          </div>

          <div>
            <label>Project Name</label>
            <input type="text" class="form-control" value="E-commerce Website">
          </div>

          <div>
            <label>Budget</label>
            <input type="text" class="form-control" value="₹80,000">
          </div>

          <div>
            <label>Status</label>
            <select class="form-control">
              <option>New</option>
              <option selected>In Review</option>
              <option>Approved</option>
              <option>Rejected</option>
            </select>
          </div>

        </div>

        <div class="mt-3">
          <label>Project Description</label>
          <textarea class="form-control" rows="4">Online store with admin panel</textarea>
        </div>

        <div class="action-bar mt-4">
          <button type="submit" class="btn btn-primary">Update Enquiry</button>
          <button type="reset" class="btn btn-outline-danger">Clear</button>
          
        </div>

      </form>

    </div>

  </main>
</div>

<!-- Mobile Sidebar -->
<div class="offcanvas offcanvas-start" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5>Admin Panel</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="nav flex-column">
      <li class="nav-item active"><a href="index.html">Enquiries</a></li>
      <li class="nav-item"><a href="#">Clients</a></li>
      <li class="nav-item"><a href="#">Projects</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
