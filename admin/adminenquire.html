<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Enquiry Dashboard</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Admin Wrapper -->
<div class="admin-wrapper d-flex">

  <!-- Sidebar (Desktop & Tablet) -->
  <aside class="admin-sidebar d-none d-lg-flex">
    <h4 class="logo">Admin Panel</h4>
    <ul class="nav flex-column mt-4">
      <li class="nav-item active"><a href="./adminenquire.html"> Enquiries</a></li>
      <li class="nav-item"><a href="./New-enquire.html">New Enquiries</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </aside>

  <!-- Admin Content -->
  <main class="admin-content flex-grow-1">

    <!-- Mobile Menu Button -->
    <button class="btn btn-primary d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
      Menu
    </button>
    
    <!-- Header -->
    <div class="admin-header d-flex justify-content-between align-items-center mb-3">
      <h2>Enquiry Management</h2>
    </div>
    <!-- Table -->
    <div class="table-card mt-2">
      <table class="table table-dark table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Sr No</th>
            <th>Client Name</th>
            <th>Project</th>
            <th>Budget</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><a href="./enquire-view.html">Amit Sharma</a></td>
            <td>E-commerce Website</td>
            <td>₹80,000</td>
            <td><span class="badge bg-success">New</span></td>
            <td class="text-center">
              <a href="./admin-edit.html" class="btn btn-sm btn-outline-info" >Edit</a>
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Admin Panel</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="nav flex-column mt-4">
      <li class="nav-item active"><a href="./adminenquire.html"> Enquiries</a></li>
      <li class="nav-item"><a href="./New-enquire.html">New Enquiries</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </div>
</div>

<div class="modal fade" id="createModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content admin-modal">
      <div class="modal-header">
        <h5 class="modal-title">Create Enquiry</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-3" placeholder="Client Name">
        <input class="form-control mb-3" placeholder="Project Name">
        <input class="form-control mb-3" placeholder="Budget">
        <textarea class="form-control" rows="3" placeholder="Project Description"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>


<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
