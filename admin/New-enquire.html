<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | New Enquiry</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="admin-wrapper">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <h4>Admin Panel</h4>
     <ul class="nav flex-column mt-4">
      <li class="nav-item active"><a href="./adminenquire.html"> Enquiries</a></li>
      <li class="nav-item"><a href="./New-enquire.html">New Enquiries</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </aside>

  <!-- Content -->
  <main class="admin-content">

    <a href="admin-dashboard.html" class="mb-3 d-inline-block">← Back to Enquiries</a>

    <div class="page-card">
      <h3 class="mb-4">Create New Enquiry</h3>

      <form>
        <div class="row g-3">

          <div class="col-md-6">
            <label>Client Name</label>
            <input type="text" class="form-control" placeholder="Enter client name">
          </div>

          <div class="col-md-6">
            <label>Email</label>
            <input type="email" class="form-control" placeholder="Enter email">
          </div>

          <div class="col-md-6">
            <label>Phone</label>
            <input type="text" class="form-control" placeholder="Enter phone number">
          </div>

          <div class="col-md-6">
            <label>Project Type</label>
            <input type="text" class="form-control" placeholder="Website / App / Software">
          </div>

          <div class="col-md-6">
            <label>Estimated Budget</label>
            <input type="text" class="form-control" placeholder="₹ Amount">
          </div>

          <div class="col-md-6">
            <label>Status</label>
            <select class="form-select">
              <option>New</option>
              <option>In Discussion</option>
              <option>Converted</option>
              <option>Closed</option>
            </select>
          </div>

          <div class="col-12">
            <label>Project Description</label>
            <textarea class="form-control" rows="4" placeholder="Describe project requirements"></textarea>
          </div>

          <div class="col-12 text-end mt-3">
            <button type="reset" class="btn btn-outline-secondary me-2">Clear</button>
            <button type="submit" class="btn btn-primary">Save Enquiry</button>
          </div>

        </div>
      </form>
    </div>

  </main>
</div>

</body>
</html>
