<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Enquiry Dashboard</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Admin Wrapper -->
  <div class="admin-wrapper d-flex">

    <!-- Sidebar (Desktop & Tablet) -->
    <aside class="admin-sidebar d-none d-lg-flex">
      <h4 class="logo">Admin Panel</h4>
      <ul class="nav flex-column mt-4">
        <li class="nav-item active"><a href="./adminenquire.html"> Enquiries</a></li>
        <li class="nav-item"><a href="./New-enquire.html">New Enquiries</a></li>
        <li class="nav-item"><a href="#">Logout</a></li>
      </ul>
    </aside>

    <!-- Admin Content -->
    <main class="admin-content flex-grow-1">

      <!-- Mobile Menu Button -->
      <button class="btn btn-primary d-lg-none mb-3" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        Menu
      </button>

      <!-- Header -->
      <div class="admin-header d-flex justify-content-between align-items-center mb-3">
        <h2>Enquiry Management</h2>
      </div>
      <!-- Table -->
      <main class="admin-content">


        <a href="./adminenquire.html" class="mb-3 d-inline-block">← Back to Enquiries</a>

        <div class="page-card">
          <h3 class="mb-4">Create New Enquiry</h3>

          <form>
            <div class="row g-3">

              <div class="col-md-6">
                <label>Client Name</label>
                <input type="text" class="form-control" placeholder="Enter client name" required />
              </div>

              <div class="col-md-6">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter email" required />
              </div>

              <div class="col-md-6">
                <label>Phone</label>
                <input type="text" class="form-control" placeholder="Enter phone number" required />
              </div>

              <div class="col-md-6">
                <label>Project Type</label>
                <input type="text" class="form-control" placeholder="Website / App / Software" required />
              </div>

              <div class="col-md-6">
                <label>Estimated Budget</label>
                <input type="text" class="form-control" placeholder="₹ Amount" required />
              </div>

              <div class="col-md-6">
                <label>Status</label>
                <select class="form-select">
                  <option>New</option>
                  <option>In Discussion</option>
                  <option>Converted</option>
                  <option>Closed</option>
                </select>
              </div>

              <div class="col-12">
                <label>Project Description</label>
                <textarea class="form-control" rows="4" placeholder="Describe project requirements"></textarea required>
          </div>

          <div class="col-12 text-end mt-3">
            <button type="reset" class="btn btn-outline-danger me-2 mb-2 mt-1">Clear</button>
            <button type="submit" class="btn btn-primary mb-2">Save Enquiry</button>
          </div>

        </div>
      </form>
    </div>

  </main>

  </main>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Admin Panel</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
     <ul class="nav flex-column mt-4">
      <li class="nav-item active"><a href="./adminenquire.html"> Enquiries</a></li>
      <li class="nav-item"><a href="./New-enquire.html">New Enquiries</a></li>
      <li class="nav-item"><a href="#">Logout</a></li>
    </ul>
  </div>
</div>

<div class="modal fade" id="createModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content admin-modal">
      <div class="modal-header">
        <h5 class="modal-title">Create Enquiry</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-3" placeholder="Client Name">
        <input class="form-control mb-3" placeholder="Project Name">
        <input class="form-control mb-3" placeholder="Budget">
        <textarea class="form-control" rows="3" placeholder="Project Description"></textarea>
              </div>
              <div class="modal-footer">
                <button class="btn btn-primary">Save</button>
              </div>
            </div>
        </div>
  </div>


  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
