<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Project Enquiry</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="enquiry-section d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-lg-7 col-md-9">
        <div class="form-card">
          <a href="./index.html">Back</a>

          <h2 class="text-center mb-4">Project Enquiry</h2>
          <p class="text-center text-muted mb-4 ">
            Let’s discuss your project requirements.
          </p>

          <form>

            <div class="mb-3">
              <label class="form-label">Client Name *</label>
              <input type="text" class="form-control" placeholder="Your name" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">Project Name *</label>
              <input type="text" class="form-control" placeholder="Project title" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number *</label>
              <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">Budget *</label>
              <input type="text" class="form-control" placeholder="Estimated budget" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">Relevant Links *</label>
              <input type="text" class="form-control" placeholder="GitHub / Drive / Figma" required/>
            </div>

            <div class="mb-4">
              <label class="form-label">Project Description *</label>
              <textarea class="form-control" rows="4" placeholder="Describe your project"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Send Enquiry
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
